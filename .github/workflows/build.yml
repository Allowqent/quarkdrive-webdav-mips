name: Manual Build for MIPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 注入环境变量关闭 LTO，解决 bitcode 冲突报错
      - name: Build with rust-musl-cross
        run: |
          docker run --rm -e CARGO_PROFILE_RELEASE_LTO="false" -v ${{ github.workspace }}:/home/rust/src messense/rust-musl-cross:mipsel-musl cargo build --release
          sudo chown -R $USER:$USER target/

      # 提取并上传编译结果
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quarkdrive-webdav-mips
          path: target/mipsel-unknown-linux-musl/release/quarkdrive-webdav
