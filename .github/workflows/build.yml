name: Manual Build for MIPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 安装最新版 Rust 工具链 (替代老旧的 actions-rs)
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: mipsel-unknown-linux-musl

      # 2. 安装 cross 工具 (专门解决交叉编译缺少依赖的问题)
      - name: Install Cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # 3. 编译程序 (用 cross 替代 cargo)
      - name: Build
        run: cross build --release --target mipsel-unknown-linux-musl

      # 4. 上传编译结果
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quarkdrive-webdav-mips
          path: target/mipsel-unknown-linux-musl/release/quarkdrive-webdav
