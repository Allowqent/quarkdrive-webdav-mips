name: Manual Build for MIPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 安装最新版 Rust 工具链 (去掉了之前的 targets 行)
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 2. 安装 cross 工具 (它自带 MIPS 的完整编译环境)
      - name: Install Cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # 3. 编译程序
      - name: Build
        run: cross build --release --target mipsel-unknown-linux-musl

      # 4. 上传编译结果
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quarkdrive-webdav-mips
          path: target/mipsel-unknown-linux-musl/release/quarkdrive-webdav
